<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="A seafarer records a voice note, five open-weight models check it through Otari, and the seafarer gets a clear result.">
  <rect x="1" y="1" width="998" height="458" rx="24" fill="#F2F4F6" stroke="#E3E7EB" stroke-width="2"/>
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#E8481A"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif">

    <g transform="translate(60 44)">
      <rect width="190" height="360" rx="30" fill="#14181D"/>
      <rect x="8" y="8" width="174" height="344" rx="24" fill="#FFFFFF"/>
      <rect x="70" y="16" width="50" height="12" rx="6" fill="#14181D"/>
      <text x="22" y="64" font-size="13" fill="#5D6670">Your ship</text>
      <text x="22" y="84" font-size="16" font-weight="700" fill="#E8481A">Ocean Pearl</text>
      <text x="22" y="122" font-size="18" font-weight="700" fill="#14181D">What's happening</text>
      <text x="22" y="144" font-size="18" font-weight="700" fill="#E8481A">on board?</text>
      <circle cx="95" cy="212" r="46" fill="#FDEAE3"/>
      <circle cx="95" cy="212" r="36" fill="#E8481A"/>
      <rect x="88" y="192" width="14" height="24" rx="7" fill="#FFFFFF"/>
      <path d="M81 210a14 14 0 0 0 28 0M95 224v8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="95" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#14181D">Hold to talk</text>
      <rect x="22" y="298" width="146" height="34" rx="17" fill="#14181D"/>
      <text x="95" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Saved, sends later</text>
    </g>
    <text x="155" y="436" text-anchor="middle" font-size="15" fill="#5D6670">Ravi speaks in Hindi, even at sea</text>

    <path d="M266 224h52" stroke="#E8481A" stroke-width="3" marker-end="url(#arrowHead)"/>

    <g transform="translate(330 44)">
      <rect width="340" height="360" rx="24" fill="#FFFFFF" stroke="#E3E7EB" stroke-width="2"/>
      <text x="24" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#E8481A">THROUGH OTARI</text>
      <g font-size="15">
        <rect x="20" y="56" width="300" height="52" rx="16" fill="#F2F4F6"/>
        <text x="40" y="80" font-weight="700" fill="#14181D">1  Understand the voice note</text>
        <text x="40" y="98" font-size="13" fill="#5D6670">MiMo V2.6 Flash</text>
        <rect x="20" y="114" width="300" height="52" rx="16" fill="#F2F4F6"/>
        <text x="40" y="138" font-weight="700" fill="#14181D">2  Read the pay slip photo</text>
        <text x="40" y="156" font-size="13" fill="#5D6670">Llama 4 Scout</text>
        <rect x="20" y="172" width="300" height="52" rx="16" fill="#F2F4F6"/>
        <text x="40" y="196" font-weight="700" fill="#14181D">3  Check the ship's records</text>
        <text x="40" y="214" font-size="13" fill="#5D6670">DeepSeek V4 Flash · MCP · web search</text>
        <rect x="20" y="230" width="300" height="52" rx="16" fill="#F2F4F6"/>
        <text x="40" y="254" font-weight="700" fill="#14181D">4  Score the risk in code</text>
        <text x="40" y="272" font-size="13" fill="#5D6670">Otari code execution sandbox</text>
        <rect x="20" y="288" width="300" height="52" rx="16" fill="#F2F4F6"/>
        <text x="40" y="312" font-weight="700" fill="#14181D">5  Explain it in Hindi</text>
        <text x="40" y="330" font-size="13" fill="#5D6670">Gemma 3 27B</text>
      </g>
    </g>
    <text x="500" y="436" text-anchor="middle" font-size="15" fill="#5D6670">All open-weight, about 25 seconds, under one cent</text>

    <path d="M682 224h52" stroke="#E8481A" stroke-width="3" marker-end="url(#arrowHead)"/>

    <g transform="translate(750 44)">
      <rect width="190" height="360" rx="30" fill="#14181D"/>
      <rect x="8" y="8" width="174" height="344" rx="24" fill="#FFFFFF"/>
      <rect x="70" y="16" width="50" height="12" rx="6" fill="#14181D"/>
      <rect x="18" y="44" width="154" height="64" rx="16" fill="#C8102E"/>
      <text x="32" y="72" font-size="16" font-weight="700" fill="#FFFFFF">Get help now</text>
      <text x="32" y="94" font-size="12" fill="#FFFFFF">This is serious</text>
      <rect x="18" y="118" width="74" height="70" rx="14" fill="#FFFFFF" stroke="#E3E7EB" stroke-width="2"/>
      <text x="55" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#C8102E">3</text>
      <text x="55" y="174" text-anchor="middle" font-size="11" fill="#5D6670">Months late</text>
      <rect x="98" y="118" width="74" height="70" rx="14" fill="#FFFFFF" stroke="#E3E7EB" stroke-width="2"/>
      <text x="135" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#14181D">$4.5k</text>
      <text x="135" y="174" text-anchor="middle" font-size="11" fill="#5D6670">Owed</text>
      <g font-size="12" fill="#14181D">
        <circle cx="28" cy="210" r="4" fill="#C8102E"/><text x="40" y="214">Food running low</text>
        <circle cx="28" cy="232" r="4" fill="#C8102E"/><text x="40" y="236">Stopped by inspectors</text>
        <circle cx="28" cy="254" r="4" fill="#C8102E"/><text x="40" y="258">Owner left a crew before</text>
      </g>
      <rect x="18" y="284" width="154" height="44" rx="22" fill="#E8481A"/>
      <text x="95" y="311" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Message ITF</text>
    </g>
    <text x="845" y="436" text-anchor="middle" font-size="15" fill="#5D6670">A clear next step, in his language</text>
  </g>
</svg>
