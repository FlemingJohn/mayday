<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Warning signs appear months before a crew is abandoned. Mayday warns early; help usually arrives late.">
  <rect x="1" y="1" width="998" height="358" rx="24" fill="#F2F4F6" stroke="#E3E7EB" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="54" font-size="22" font-weight="700" fill="#14181D">The warning signs come <tspan fill="#E8481A">months</tspan> before the crew is left stranded</text>

    <rect x="196" y="82" width="372" height="40" rx="20" fill="#E1F2EA"/>
    <text x="382" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#00804A">Mayday warns here, while there is time to act</text>
    <path d="M226 122v24M538 122v24" stroke="#00804A" stroke-width="2" stroke-dasharray="4 4"/>

    <path d="M60 196H940" stroke="#C3CAD1" stroke-width="4" stroke-linecap="round"/>

    <g font-size="15" fill="#5D6670" font-weight="700" text-anchor="middle">
      <text x="110" y="232">AUG</text>
      <text x="270" y="232">SEP</text>
      <text x="430" y="232">OCT</text>
      <text x="590" y="232">NOV</text>
      <text x="880" y="232">FEB</text>
    </g>
    <text x="735" y="201" text-anchor="middle" font-size="22" fill="#C3CAD1" letter-spacing="4">· · ·</text>

    <circle cx="110" cy="196" r="12" fill="#F2B705" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="270" cy="196" r="12" fill="#F2B705" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="430" cy="196" r="12" fill="#E8481A" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="590" cy="196" r="12" fill="#C8102E" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="880" cy="196" r="16" fill="#14181D" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M873 189l14 14M887 189l-14 14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <g font-size="16" fill="#14181D">
      <rect x="40" y="256" width="140" height="70" rx="16" fill="#FFFFFF" stroke="#E3E7EB" stroke-width="2"/>
      <text x="110" y="286" text-anchor="middle" font-weight="700">Pay is late</text>
      <text x="110" y="308" text-anchor="middle" fill="#5D6670" font-size="14">"next week"</text>

      <rect x="196" y="256" width="148" height="70" rx="16" fill="#FFFFFF" stroke="#E3E7EB" stroke-width="2"/>
      <text x="270" y="286" text-anchor="middle" font-weight="700">Ship stopped</text>
      <text x="270" y="308" text-anchor="middle" fill="#5D6670" font-size="14">by port inspectors</text>

      <rect x="356" y="256" width="148" height="70" rx="16" fill="#FFFFFF" stroke="#E3E7EB" stroke-width="2"/>
      <text x="430" y="286" text-anchor="middle" font-weight="700">2 months unpaid</text>
      <text x="430" y="308" text-anchor="middle" fill="#5D6670" font-size="14">manager vague</text>

      <rect x="516" y="256" width="148" height="70" rx="16" fill="#FFFFFF" stroke="#E3E7EB" stroke-width="2"/>
      <text x="590" y="286" text-anchor="middle" font-weight="700">Food running low</text>
      <text x="590" y="308" text-anchor="middle" fill="#5D6670" font-size="14">owner goes silent</text>

      <rect x="790" y="256" width="180" height="70" rx="16" fill="#14181D"/>
      <text x="880" y="286" text-anchor="middle" font-weight="700" fill="#FFFFFF">Crew abandoned</text>
      <text x="880" y="308" text-anchor="middle" fill="#C9D3DB" font-size="14">help usually arrives here</text>
    </g>
  </g>
</svg>
